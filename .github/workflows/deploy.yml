name: Deploy Cellarium

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync code to app directory
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='dump.sql' \
            --exclude='compose.prod.yaml' \
            ./ "$HOME/apps/cellarium-test/"

      - name: Rebuild and restart
        run: |
          cd "$HOME/apps/cellarium-test"
          docker compose -f compose.prod.yaml up -d --build

      - name: Laravel post-deploy
        run: |
          cd "$HOME/apps/cellarium-test"
          docker compose -f compose.prod.yaml exec -T app php artisan migrate --force
          docker compose -f compose.prod.yaml exec -T app php artisan optimize:clear
          docker compose -f compose.prod.yaml exec -T app php artisan optimize